<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>

  <!-- Bootstrap for layout, responsiveness and base components -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Connect the external CSS file -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container">
    <div class="card todo-card mx-auto">
      <div class="card-body">
        <h1 class="text-center mb-1">To-Do List</h1>
        <p class="text-center text-muted mb-4">Track tasks with priority, due dates, and categories.</p>

        <!-- Task entry form: title, description, priority, due date, category -->
        <form id="taskForm" class="task-form mb-4">
          <div class="mb-2">
            <input type="text" id="taskInput" class="form-control" placeholder="Task title..." required>
          </div>
          <div class="mb-2">
            <textarea id="taskDescInput" class="form-control" rows="2" placeholder="Description / notes (optional)"></textarea>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-4">
              <label for="taskPriorityInput" class="form-label small text-muted mb-1">Priority</label>
              <select id="taskPriorityInput" class="form-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="col-4">
              <label for="taskDueInput" class="form-label small text-muted mb-1">Due date</label>
              <input type="date" id="taskDueInput" class="form-control">
            </div>
            <div class="col-4">
              <label for="taskCategoryInput" class="form-label small text-muted mb-1">Category</label>
              <input type="text" id="taskCategoryInput" class="form-control" placeholder="e.g. Work">
            </div>
          </div>
          <button type="submit" id="addTaskBtn" class="btn btn-primary w-100">Add Task</button>
        </form>

        <!-- Filter / sort controls -->
        <div class="d-flex flex-wrap gap-2 mb-3 justify-content-between align-items-center">
          <div class="btn-group" role="group" id="statusFilterGroup">
            <button type="button" class="btn btn-sm btn-outline-secondary active" data-filter="all">All</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-filter="pending">Pending</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-filter="completed">Completed</button>
          </div>
          <select id="sortSelect" class="form-select form-select-sm w-auto" aria-label="Sort tasks">
            <option value="created">Sort: Newest</option>
            <option value="due">Sort: Due date</option>
            <option value="priority">Sort: Priority</option>
          </select>
        </div>

        <!-- Tasks render here as <li> items via DOM createElement -->
        <ul id="taskList" class="list-group"></ul>

        <!-- Shown when there are no tasks matching the current filter -->
        <p id="emptyMessage" class="text-center text-muted mt-4 mb-0">No tasks yet. Add one above!</p>

        <!-- Summary of task counts -->
        <p id="taskSummary" class="text-center text-muted small mt-3 mb-0"></p>
      </div>
    </div>
  </main>

  <!-- Connect the external JS file (placed at the end so the DOM loads first) -->
  <script src="js/script.js"></script>
</body>
</html>
