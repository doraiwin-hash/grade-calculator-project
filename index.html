<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management App</title>

  <!-- Bootstrap for layout, responsiveness and base components -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Connect the external CSS file -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container py-4">
    <h1 class="text-center mb-1">Product Management App</h1>
    <p class="text-center text-muted mb-4">Backed by the Fake Store API — add, edit, delete and search products.</p>

    <!-- Add / Edit product form -->
    <form id="productForm" class="card product-form mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3" id="formTitle">Add New Product</h2>

        <div class="row g-2 mb-2">
          <div class="col-md-6">
            <input type="text" id="titleInput" class="form-control" placeholder="Title" required>
          </div>
          <div class="col-md-3">
            <input type="number" id="priceInput" class="form-control" placeholder="Price" min="0" step="0.01" required>
          </div>
          <div class="col-md-3">
            <select id="categoryInput" class="form-select" aria-label="Category" required>
              <option value="" disabled selected>Category</option>
              <option value="electronics">Electronics</option>
              <option value="jewelery">Jewelery</option>
              <option value="men's clothing">Men's Clothing</option>
              <option value="women's clothing">Women's Clothing</option>
              <option value="__other__">Other...</option>
            </select>
          </div>
        </div>

        <div class="mb-2 d-none" id="customCategoryWrap">
          <input type="text" id="customCategoryInput" class="form-control" placeholder="Enter custom category">
        </div>

        <div class="mb-2">
          <textarea id="descriptionInput" class="form-control" rows="2" placeholder="Description"></textarea>
        </div>

        <div class="row g-2 mb-3 align-items-center">
          <div class="col-md-7">
            <input type="url" id="imageInput" class="form-control" placeholder="Image URL">
          </div>
          <div class="col-md-5">
            <input type="file" id="imageFileInput" class="form-control" accept="image/*" aria-label="Attach an image file">
          </div>
        </div>
        <div class="mb-3">
          <img id="imagePreview" class="d-none" alt="Selected image preview">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" id="submitBtn" class="btn btn-primary">Add Product</button>
          <button type="button" id="cancelEditBtn" class="btn btn-outline-secondary d-none">Cancel</button>
        </div>
      </div>
    </form>

    <!-- Search bar -->
    <div class="mb-4">
      <input type="search" id="searchInput" class="form-control" placeholder="Search products by title...">
    </div>

    <!-- Status area: loading / error messages -->
    <p id="statusMessage" class="text-center text-muted"></p>

    <!-- Product grid, populated via DOM createElement -->
    <div id="productGrid" class="row g-3"></div>
  </main>

  <!-- Connect the external JS file (placed at the end so the DOM loads first) -->
  <script src="js/script.js"></script>
</body>
</html>
