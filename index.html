<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - Operators & Functions</title>

  <!-- Connect the CSS file -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="card">
    <h1>Calculator</h1>
    <p>Enter number(s) below, then press an operation button.</p>

    <!-- Input boxes for the two numbers used in arithmetic operations -->
    <div class="input-group">
      <label for="num1">Number 1</label>
      <input type="number" id="num1" placeholder="Enter first number">
    </div>

    <div class="input-group">
      <label for="num2">Number 2</label>
      <input type="number" id="num2" placeholder="Enter second number">
    </div>

    <!-- Basic arithmetic operations -->
    <div class="button-row">
      <button type="button" onclick="calculate('add')">+ Add</button>
      <button type="button" onclick="calculate('subtract')">− Subtract</button>
      <button type="button" onclick="calculate('multiply')">× Multiply</button>
      <button type="button" onclick="calculate('divide')">÷ Divide</button>
    </div>

    <hr>

    <p class="hint">Square and Cube use only Number 1.</p>

    <!-- Square and cube use only the first number -->
    <div class="button-row">
      <button type="button" class="secondary" onclick="calculate('square')">x² Square</button>
      <button type="button" class="secondary" onclick="calculate('cube')">x³ Cube</button>
    </div>

    <div class="button-row">
      <button type="button" class="ghost" onclick="resetCalculator()">Reset</button>
    </div>

    <!-- Result panel, hidden until a calculation is performed -->
    <section id="resultPanel" class="results hidden">
      <p>Result: <span id="resultValue"></span></p>
    </section>
  </main>

  <!-- Connect the JS file (placed at the end so the DOM loads first) -->
  <script src="js/script.js"></script>
</body>
</html>
